rootProject.name = 'Valthorne-examples'

// Opt in when validating engine changes that have not been published to Maven Central.
def localValthorne = providers.gradleProperty('valthorneDir').orNull
if (localValthorne) {
    includeBuild(file(localValthorne)) {
        dependencySubstitution {
            substitute module('io.github.tehnewb:Valthorne') using project(':')
        }
    }
}
