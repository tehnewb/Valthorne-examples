name: Examples CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the development engine reproducible while these APIs await publication.
env:
  VALTHORNE_ENGINE_REVISION: 256cde556a407f347e27644e9d0de9e744f8103e

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and native checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out matching development engine
        uses: actions/checkout@v4
        with:
          repository: tehnewb/Valthorne
          ref: ${{ env.VALTHORNE_ENGINE_REVISION }}
          path: build/engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build, document and validate against the matching engine
        shell: bash
        run: bash ./gradlew '-PvalthorneDir=build/engine' build listExamples examplesZip installDist --console=plain --stacktrace
      - name: Check installed Unix launcher
        if: runner.os != 'Windows'
        run: |
          build/install/Valthorne-examples/bin/Valthorne-examples --list
          for launcher in build/install/Valthorne-examples/*.sh; do
            "$launcher" --help
          done
      - name: Check installed Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/install/Valthorne-examples/bin/Valthorne-examples.bat --list
          if ($LASTEXITCODE -ne 0) { throw 'Catalog failed' }
          foreach ($launcher in Get-ChildItem build/install/Valthorne-examples/*.bat) {
            & $launcher.FullName --help
            if ($LASTEXITCODE -ne 0) { throw "Launcher failed: $launcher" }
          }
      - name: Check Java-only connection diagnostic
        run: java tools/JavaLoopbackCheck.java
      - name: Retain reference and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.os }}
          path: |
            build/reports/
            build/docs/javadoc/
          if-no-files-found: ignore

  graphics:
    name: Portable demos / Linux Mesa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - name: Check out matching development engine
        uses: actions/checkout@v4
        with:
          repository: tehnewb/Valthorne
          ref: ${{ env.VALTHORNE_ENGINE_REVISION }}
          path: build/engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software graphics and desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 fonts-dejavu-core
      - name: Run portable graphical smoke checks
        shell: bash
        run: |
          for demo in runMinimalExample run3DExample runPhysics3DExample runLighting2DExample runUIShowcase runAudioStudio; do
            xvfb-run -a bash ./gradlew '-PvalthorneDir=build/engine' "$demo" --args="--smoke" --console=plain --stacktrace
          done
      - name: Retain captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-demo-captures
          path: |
            build/captures/
            build/ui-showcase/
            build/audio-studio/
          if-no-files-found: ignore
